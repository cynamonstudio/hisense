#ad{position:relative;width:1920px;height:1080px;overflow:hidden;cursor:pointer;

.l{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform,opacity}

#para{clip-path:polygon(1312px 67.8px,1132.8px 154.9px,1135.1px 325.1px,1061.1px 432.6px,1000.7px 811.1px,896.7px 1080px,1489.6px 1080px,1657.4px 1076.8px,1753.2px 864.9px,1760px 623px,1735.3px 434.8px,1697.1px 298.2px,1718.7px 181.7px,1495.7px 74.2px,1460.6px 65px)}

#tv .m,#projV .m,#projH .m{filter:drop-shadow(4px 14px 14px rgba(0,0,0,.25))}
#txt text{font-family:HS,Arial,sans-serif;fill:#fff}
#txt .md{font-weight:500}
#txt .gold{fill:url(#goldTxt)}
#logo img{position:absolute;left:94.8px;top:73.1px;width:324.8px;display:block}
#cta{position:absolute;left:508px;top:926.4px;width:404.6px;height:94.6px;overflow:hidden;
  background:linear-gradient(180deg,#f1d696 0%,#e2b96c 45%,#cf9e52 100%);
  box-shadow:0 12px 28px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.5)}
#cta span{position:absolute;left:0;right:0;top:0;bottom:0;text-align:center;line-height:94.6px;
  font-size:48.95px;font-weight:500;color:#ab1e38;letter-spacing:.5px}
#cta::after{content:"";position:absolute;top:-40px;left:-180px;width:120px;height:180px;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 100%);
  transform:skewX(-22deg);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{left:-180px}45%,100%{left:520px}}
/* ornaments: float + gentle rotation/scale + glints */
.fl{position:absolute;left:0;top:0;width:0;height:0;animation:fl 3.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(4px) rotate(-12deg) scale(.95)}50%{transform:translateY(-10px) rotate(12deg) scale(1.07)}}
.fl img{animation:glint 2.8s ease-in-out infinite}
@keyframes glint{0%,62%,100%{filter:brightness(1) drop-shadow(0 0 0 rgba(255,226,150,0))}
  74%{filter:brightness(1.35) drop-shadow(0 0 14px rgba(255,226,150,.85))}
  84%{filter:brightness(1.05) drop-shadow(0 0 5px rgba(255,226,150,.3))}}
/* projector light effects (screen blend, gentle flicker) */
.raysH{animation:rays 1.3s ease-in-out infinite}
@keyframes rays{0%,100%{opacity:.85;transform:scaleY(.97)}30%{opacity:1;transform:scaleY(1.02)}55%{opacity:.8}78%{opacity:.95;transform:scaleY(1)}}
.core{animation:flick 1.05s ease-in-out infinite}
.core2{animation:flick .85s ease-in-out infinite}
.halo{animation:halo 1.2s ease-in-out infinite}
.halo.h2{animation-duration:1s;animation-delay:-.7s}
.streak{animation:streak .95s ease-in-out infinite}
.fxH-streak{animation-delay:-.3s;animation-duration:1.15s}
@keyframes flick{0%,100%{opacity:.85}25%{opacity:1}45%{opacity:.78}70%{opacity:.96}}
@keyframes halo{0%,100%{transform:scale(.96);opacity:.85}35%{transform:scale(1.05);opacity:1}65%{transform:scale(.98);opacity:.88}}
@keyframes streak{0%,100%{transform:scale(.96);opacity:.82}40%{transform:scale(1.05);opacity:1}70%{transform:scale(.99);opacity:.88}}

</style>
</head>

<script>
(function(){
  "use strict";
  var ad=document.getElementById("ad"), wrap=document.getElementById("wrap");
  ad.addEventListener("click",function(){ window.open(window.clickTag||clickTag,"_blank"); });
  function fit(){
    var s=Math.min(window.innerWidth/1920, window.innerHeight/1080);
    wrap.style.transform="scale("+s+") translate(-50%,-50%)";
  }
  window.addEventListener("resize",fit); fit();
  /* ---------- intro timeline (seconds) ---------- */
  var E={out:function(t){return 1-Math.pow(1-t,3);},inOut:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;},
    back:function(t){var c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}};
  function clamp(v){return v<0?0:v>1?1:v;}
  function seg(t,a,d,e){return (e||E.out)(clamp((t-a)/d));}
  function mix(a,b,t){return a+(b-a)*t;}
  function $(id){return document.getElementById(id);}
  function tf(el,x,y,s,o){ el.style.transform="translate3d("+x.toFixed(1)+"px,"+y.toFixed(1)+"px,0)"+(s!=null?" scale("+s.toFixed(4)+")":""); if(o!=null) el.style.opacity=o.toFixed(3); }
  var para=$("paraW"), ORN=[].slice.call(document.querySelectorAll(".orn")), LN=[].slice.call(document.querySelectorAll(".ln")),
      STAGE=[].slice.call(document.querySelectorAll(".stage")), rib=$("rib"), cta=$("ctaW"), cnt=$("cnt");
  function frame(t){
    // 1) logo + background are there from the start; the Pazuras slide in from the right
    var pa=seg(t,.3,1.1,E.out); tf(para, mix(260,0,pa), 0, null, clamp(seg(t,.3,.8,E.out)));   /* shorter slide + fade in from 0 */
    // 2) ornaments pop in with a scale, each with a slight offset
    for(var i=0;i<ORN.length;i++){ var k=seg(t,.35+i*.08,.55,E.back); tf(ORN[i],0,0,Math.max(0,k),k>0?1:0); }
    // 3) headline lines rise out of their masks
    for(var n=0;n<LN.length;n++) LN[n].setAttribute("transform","translate(0 "+mix(110,0,seg(t,1.7+n*.14,.6,E.out)).toFixed(1)+")");
    cnt.textContent=String(Math.round(seg(t,1.9,1.3,E.out)*5000/50)*50);
    // 4) podiums + devices slide up with a slight offset
    for(var j=0;j<STAGE.length;j++){ var off=+STAGE[j].getAttribute("data-off"); tf(STAGE[j],0,mix(820,0,seg(t,1.7+off*.6,.9,E.out)),null);   /* together with the headline */ }
    // 5) cashback ribbon + CTA
    tf(rib, mix(480,0,seg(t,1.7,.7,E.out)), 0);   /* together with the headline */
    var c=seg(t,2.9,.5,E.back); tf(cta,0,0,Math.max(0,mix(.6,1,c)),clamp(c*3));
  }
  var t0=0, started=false;
  function loop(now){ if(!t0) t0=now; var t=(now-t0)/1000; frame(t); if(t<6) requestAnimationFrame(loop); }
  window.HisenseIntro={replay:function(){ t0=0; requestAnimationFrame(loop); }, at:function(t){ frame(t); }};
  frame(0);
  function go(){ if(started) return; started=true; ad.classList.add("ready"); requestAnimationFrame(loop); }
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(go); setTimeout(go,1500); } else window.addEventListener("load",go);
})();
</script>
