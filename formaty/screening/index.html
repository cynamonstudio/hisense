<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisense – billboard + tapeta (podgląd na portalu)</title>
<style>
@font-face{font-family:HS;src:url(../i1920/fonts/hs-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:HS;src:url(../i1920/fonts/hs-Medium.woff2) format("woff2");font-weight:500}
@font-face{font-family:HS;src:url(../i1920/fonts/hs-Bold.woff2) format("woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#022b25;overflow-x:hidden}
/* native scrollbar hidden, custom thin one drawn with JS */
html{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
#sbar{position:fixed;right:3px;top:3px;bottom:3px;width:4px;z-index:50;border-radius:2px;background:rgba(255,255,255,.12);opacity:.35;transition:opacity .3s,width .2s}
#sbar.on,#sbar:hover{opacity:1;width:6px}
#sbar i{position:absolute;left:0;right:0;top:0;border-radius:3px;background:rgba(255,255,255,.75);cursor:grab}
#sbar i:active{cursor:grabbing}
body{font-family:Arial,sans-serif}
/* whole page is designed at 1920 px and zoomed to the frame width */
#root{width:1920px;position:relative}

/* ---------- wallpaper (fixed, does not move while scrolling) ---------- */
#wall{position:fixed;left:0;top:0;width:1920px;height:1080px;z-index:0;overflow:hidden}
#wall svg{position:absolute;left:0;top:0}
.st{position:absolute;display:block}

/* ---------- simplified portal ---------- */
#hdr{position:relative;z-index:5;height:122px;background:#fff;border-bottom:1px solid #e6e6e6;
  box-shadow:0 2px 10px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 163px}
#hdr b{font:700 34px/1 Arial,sans-serif;color:#111;letter-spacing:-.5px}
#hdr .nav{display:flex;gap:26px;margin-left:60px}
#hdr .nav i{display:block;width:90px;height:14px;border-radius:7px;background:#e8e8e8}
#hdr .srch{margin-left:auto;width:300px;height:44px;border-radius:22px;border:2px solid #ececec}
#hdr .me{margin-left:24px;width:44px;height:44px;border-radius:50%;background:#e8e8e8}
.col{position:relative;z-index:2;width:1594px;margin:0 auto;background:#fff;padding:40px 56px 56px;display:flow-root}
.col.ad{background:none;width:1594px;height:498px;padding:0}
#bbw{width:1594px;height:498px;overflow:hidden;position:relative;z-index:3}

/* ---------- billboard: pozycje z reklama.pdf (1920×608) przeliczone na 1594×498 ---------- */
#bb{position:relative;width:1594px;height:498px;overflow:hidden;cursor:pointer;font-family:HS,Arial,sans-serif;color:#fff}
#bb .m{position:absolute;display:block;max-width:none}
#bb .logo{left:50.3px;top:54.2px;width:272.8px;height:42.8px}
#bb .ttl{position:absolute;left:41.8px;top:165.8px;font-size:39.8px;line-height:47.8px;font-weight:400}
#bb .ttl .gold{font-weight:500;background:linear-gradient(100deg,#c8963a,#e9c06a 35%,#f6dc93 60%,#ddb158 80%,#f3d887);-webkit-background-clip:text;background-clip:text;color:transparent}
#bb .cta{position:absolute;left:50.3px;top:387.7px;width:302.2px;height:69.7px;overflow:hidden;
  background:linear-gradient(180deg,#f1d696 0%,#e2b96c 45%,#cf9e52 100%);box-shadow:0 8px 18px rgba(0,0,0,.28);
  color:#ab1e38;font:500 36px/69.7px HS,Arial,sans-serif;text-align:center}
#bb .cta::after{content:"";position:absolute;top:-30px;left:-120px;width:70px;height:120px;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));transform:skewX(-22deg);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{0%{left:-120px}45%,100%{left:360px}}
#bb .podT{left:703.5px;top:260.8px;width:272.6px;height:332.1px;z-index:1}
#bb .tv{left:574.3px;top:5.7px;width:530.9px;height:305.7px;z-index:2;filter:drop-shadow(0 10px 14px rgba(0,0,0,.28))}
#bb .podP{left:424.4px;top:336.9px;width:484px;height:589.6px;z-index:3}
#bb .proj{left:445.4px;top:241.7px;width:215.8px;height:170.6px;z-index:4;filter:drop-shadow(2px 8px 8px rgba(0,0,0,.28))}
#bb .laser{left:617.1px;top:336.9px;width:222.6px;height:76.3px;z-index:5;filter:drop-shadow(2px 6px 6px rgba(0,0,0,.28))}
#bb .people{left:827.8px;top:7.5px;width:837.1px;height:799.4px;z-index:6;filter:drop-shadow(14px 12px 16px rgba(0,0,0,.22))}
#bb .fl{z-index:8;opacity:0;animation:fl 3.4s ease-in-out infinite, pop .45s ease forwards}
#bb .fl img{width:100%;height:100%;display:block;object-fit:contain}
@keyframes fl{0%,100%{transform:translateY(3px) rotate(-10deg) scale(.95)}50%{transform:translateY(-7px) rotate(10deg) scale(1.06)}}
@keyframes pop{to{opacity:1}}
/* entrance: ludzie z prawej, podesty z dołu, tekst na końcu */
#bb .logo{opacity:0;animation:fade .45s ease .05s forwards}
#bb .in{opacity:0;transform:translateX(90px);animation:inR 1s cubic-bezier(.2,.8,.2,1) .15s forwards}
#bb .up{opacity:0;transform:translateY(190px);animation:inU 1s cubic-bezier(.2,.8,.2,1) .55s forwards}
#bb .podP,#bb .proj,#bb .laser{animation-delay:.78s}
#bb .tx{opacity:0;transform:translateY(28px);animation:inU .65s cubic-bezier(.2,.8,.2,1) 1.05s forwards}
#bb .cta.tx{animation-delay:1.25s}
@keyframes fade{to{opacity:1}}
@keyframes inR{to{opacity:1;transform:none}}
@keyframes inU{to{opacity:1;transform:none}}

/* ---------- placeholders ---------- */
.ph{background:#eceef0;border-radius:10px}
.ln{height:16px;border-radius:8px;background:#e8e8e8;margin-top:14px}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:28px;padding:28px 0}
.card .ph{height:240px}
.card.big .ph{height:420px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;padding:10px 0 34px}
.row .ph{height:170px}
/* opcja 2: ten sam portal na białym tle, belka nav, baner między nav a treścią */
html.ramka, html.ramka body { background:#fff; }
html.ramka #wall { display:none; }
html.ramka #sbar { background:rgba(0,0,0,.06); }
html.ramka #sbar i { background:rgba(0,0,0,.32); }
html.ramka .col { width:1440px; }
html.ramka .col.ad { width:1224px; height:auto; background:transparent; margin-top:40px; }
html.ramka #bbw { background:radial-gradient(ellipse 90% 80% at 50% 32%, #0f8f7f 0%, #086355 48%, #03362e 100%); }
html.ramka #bb { transform-origin:0 0; }
</style>
</head>
<body>
<div id="sbar" aria-hidden="true"><i></i></div>
<div id="root">

  <!-- wallpaper: Hisense gradient + light facets + stationary stars (seen only on the sides) -->
  <div id="wall">
    <svg width="100%" height="100%" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="dg" gradientUnits="userSpaceOnUse" cx="960" cy="330" r="1250"><stop offset="0" stop-color="#0f8f7f"/><stop offset=".45" stop-color="#086355"/><stop offset="1" stop-color="#03362e"/></radialGradient>
        <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1920" y2="1080">
          <stop offset="0" stop-color="#1bb3a3"/><stop offset=".3" stop-color="#119585"/><stop offset=".6" stop-color="#0c8072"/><stop offset="1" stop-color="#086a5e"/></linearGradient>
        <filter id="sh" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1880">
          <feDropShadow dx="22" dy="38" stdDeviation="22" flood-color="#00241f" flood-opacity=".25"/></filter>
      </defs>
      <rect width="1920" height="1080" fill="url(#dg)"/>
    </svg>
    <img class="st" src="../i1920/img/x47.webp" alt="" style="left:32px;top:185px;width:46px;transform:rotate(-14deg)">
    <img class="st" src="../i1920/img/x42.webp" alt="" style="left:102px;top:330px;width:24px;transform:rotate(18deg)">
    <img class="st" src="../i1920/img/x40.webp" alt="" style="left:46px;top:475px;width:36px;transform:rotate(20deg)">
    <img class="st" src="../i1920/img/x41.webp" alt="" style="left:108px;top:610px;width:22px;transform:rotate(-16deg)">
    <img class="st" src="../i1920/img/x41.webp" alt="" style="left:24px;top:735px;width:38px;transform:rotate(8deg)">
    <img class="st" src="../i1920/img/x42.webp" alt="" style="left:88px;top:930px;width:24px;transform:rotate(-28deg)">
    <img class="st" src="../i1920/img/x41.webp" alt="" style="left:1816px;top:190px;width:42px;transform:rotate(18deg)">
    <img class="st" src="../i1920/img/x40.webp" alt="" style="left:1772px;top:345px;width:24px;transform:rotate(-14deg)">
    <img class="st" src="../i1920/img/x47.webp" alt="" style="left:1828px;top:500px;width:32px;transform:rotate(10deg)">
    <img class="st" src="../i1920/img/x40.webp" alt="" style="left:1774px;top:700px;width:38px;transform:rotate(-12deg)">
    <img class="st" src="../i1920/img/x42.webp" alt="" style="left:1836px;top:920px;width:24px;transform:rotate(24deg)">
  </div>

  <!-- simplified portal header (no logos) -->
  <div id="hdr"><b>portal.pl</b><span class="nav"><i></i><i></i><i></i><i></i><i></i></span><span class="srch"></span><span class="me"></span></div>

  <!-- billboard 1260x400 with the Pazuras -->
  <div class="col ad"><div id="bbw">
    <div id="bb" role="link" aria-label="Hisense – zwrot do 5000 PLN">
      <img class="m up podT" src="../i1920/img/x30.webp" alt="">
      <img class="m up tv" src="../i1920/img/x31.webp" alt="Telewizor Hisense">
      <img class="m up podP" src="../i1920/img/x30.webp" alt="">
      <img class="m up proj" src="../i1920/img/x32.webp" alt="Projektor Hisense">
      <img class="m up laser" src="../i1920/img/x33.webp" alt="Laser TV Hisense">
      <img class="m in people" src="../i1920/img/x39.webp" alt="Edyta i Cezary Pazurowie">
      <div class="m fl" style="left:435.5px;top:30.2px;width:68.4px;height:71px;animation-delay:-.4s,.35s"><img src="../i1920/img/x41.webp" alt="" style="transform:rotate(-56deg)"></div>
      <div class="m fl" style="left:553.3px;top:41.7px;width:68.2px;height:71px;animation-delay:-1.1s,.45s"><img src="../i1920/img/x40.webp" alt="" style="transform:rotate(-56deg)"></div>
      <div class="m fl" style="left:528.9px;top:168.3px;width:48.7px;height:53.8px;animation-delay:-2s,.55s"><img src="../i1920/img/x41.webp" alt="" style="transform:rotate(-111deg)"></div>
      <div class="m fl" style="left:1054.7px;top:195.2px;width:47.9px;height:47.4px;animation-delay:-.7s,.65s"><img src="../i1920/img/x42.webp" alt="" style="transform:rotate(-56deg)"></div>
      <div class="m fl" style="left:963.2px;top:356.3px;width:86px;height:77.2px;animation-delay:-1.4s,.75s"><img src="../i1920/img/x40.webp" alt="" style="transform:rotate(-27deg)"></div>
      <div class="m fl" style="left:1442.1px;top:26px;width:68.2px;height:71px;animation-delay:-1.8s,.5s"><img src="../i1920/img/x40.webp" alt="" style="transform:rotate(-56deg)"></div>
      <div class="m fl" style="left:1471.9px;top:132.6px;width:61.8px;height:68.2px;animation-delay:-2.4s,.7s"><img src="../i1920/img/x41.webp" alt="" style="transform:rotate(-111deg)"></div>
      <div class="m fl" style="left:684.7px;top:467.2px;width:133.4px;height:120.6px;animation-delay:-.9s,.8s"><img src="../i1920/img/x47.webp" alt="" style="transform:rotate(-27deg)"></div>
      <div class="m fl" style="left:15.4px;top:468.8px;width:137.7px;height:136.2px;animation-delay:-1.5s,.85s"><img src="../i1920/img/x42.webp" alt="" style="transform:rotate(-56deg)"></div>
      <img class="m logo" src="../i1920/img/logo.svg" alt="Hisense">
      <div class="ttl tx">Kup TV lub projektor<br>Hisense i odbierz<br>zwrot do <span class="gold">5000 PLN</span></div>
      <div class="cta tx">SKORZYSTAJ</div>
    </div>
  </div></div>

  <!-- portal content -->
  <div class="col">
    <div class="grid">
      <div class="card big"><div class="ph"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:55%"></div></div>
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:50%"></div></div>
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:65%"></div><div class="ln" style="width:40%"></div></div>
    </div>
    <div class="row"><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:60%"></div></div><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:50%"></div></div><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:65%"></div></div></div>
    <div class="grid">
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:60%"></div></div>
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div>
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:50%"></div></div>
    </div>
    <div class="row"><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:60%"></div></div><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:50%"></div></div><div><div class="ph"></div><div class="ln"></div><div class="ln" style="width:65%"></div></div></div>
    <div class="grid" style="padding-bottom:60px">
      <div class="card big"><div class="ph"></div><div class="ln" style="width:80%"></div><div class="ln" style="width:55%"></div></div>
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:70%"></div></div>
      <div class="card"><div class="ph"></div><div class="ln"></div><div class="ln" style="width:65%"></div></div>
    </div>
  </div>
</div>
<script>
(function(){
  // the 1920 px design is zoomed to the frame width; the wallpaper is scaled to cover the viewport
  function fit(){
    var root=document.getElementById('root'), wall=document.getElementById('wall'), bb=document.getElementById('bb'), box=document.getElementById('bbw');
    var k = window.innerWidth/1920;
    root.style.zoom = k;
    wall.style.height = Math.ceil(window.innerHeight/k) + 'px';
    if (document.documentElement.classList.contains('ramka')) {
      var adW = 1224, s = adW / 1594;
      box.style.width = adW + 'px';
      box.style.height = (498 * s) + 'px';
      bb.style.transform = 'scale(' + s + ')';
    } else {
      bb.style.transform = '';
      box.style.width = '';
      box.style.height = '';
    }
  }
  window.addEventListener('resize',fit); fit();
  function reportY(){ try { parent.postMessage({ hisenseY: window.scrollY || 0 }, '*'); } catch (err) {} }
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.hisenseOpt != null) {
      document.documentElement.classList.toggle('ramka', e.data.hisenseOpt === 2);
      if (e.data.hisenseOpt !== 2) window.scrollTo(0, 0);
      requestAnimationFrame(fit);
    }
    if (typeof e.data.hisenseScrollBy === 'number') window.scrollBy(0, e.data.hisenseScrollBy);
  });
  // custom thin scrollbar
  var bar=document.getElementById('sbar'), th=bar.firstElementChild, hideT, drag=null;
  function upd(){
    var de=document.documentElement, H=de.scrollHeight, V=window.innerHeight, T=bar.clientHeight;
    if(H<=V+1){ bar.style.display='none'; return; } bar.style.display='';
    var h=Math.max(24, T*V/H), y=(T-h)*(window.scrollY/(H-V));
    th.style.height=h+'px'; th.style.transform='translateY('+y+'px)';
  }
  function flash(){ bar.classList.add('on'); clearTimeout(hideT); hideT=setTimeout(function(){ if(!drag) bar.classList.remove('on'); },900); }
  window.addEventListener('scroll',function(){ upd(); flash(); reportY(); },{passive:true});
  window.addEventListener('resize',upd); window.addEventListener('load',upd); setTimeout(upd,300);
  th.addEventListener('pointerdown',function(e){ drag={y:e.clientY,s:window.scrollY}; th.setPointerCapture(e.pointerId); e.preventDefault(); bar.classList.add('on'); });
  th.addEventListener('pointermove',function(e){ if(!drag) return; var de=document.documentElement, H=de.scrollHeight, V=window.innerHeight, T=bar.clientHeight, h=th.offsetHeight;
    window.scrollTo(0, drag.s + (e.clientY-drag.y)*(H-V)/Math.max(1,T-h)); });
  th.addEventListener('pointerup',function(){ drag=null; flash(); });
  bar.addEventListener('pointerdown',function(e){ if(e.target!==bar) return; var r=bar.getBoundingClientRect(); var de=document.documentElement;
    window.scrollTo({top:(e.clientY-r.top)/r.height*(de.scrollHeight-window.innerHeight),behavior:'smooth'}); });
  document.getElementById('bb').addEventListener('click',function(){ window.open('https://hisense.pl/','_blank'); });
})();
</script>
</body>
</html>
